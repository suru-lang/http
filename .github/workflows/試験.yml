# kumu 試験 と kumu 点検 を、Linux と macOS と Windows(MSYS2)で動かします。
# HTTPS のクライアントは、手元の TLS の相手(試しの CA の証明書)と、本物の https://example.com/ で確かめます。
# 例/サイト.suru と 例/ブラウザチャット.suru・例/こだま.suru をバイナリにして起動し、curl と Node の WebSocket で確かめます。
name: 試験

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: clang を入れる(Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev
      - name: OpenSSL の pkg-config を探せるようにする(macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 > /dev/null 2>&1 || brew install openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: kumu と suruc を入れる
        # @main は Go のモジュールのプロキシが少し前の main を覚えていることがあるので、GitHub から直接取る
        env:
          GOPROXY: direct
        run: |
          go install github.com/suru-lang/suru/cmd/kumu@main
          go install github.com/suru-lang/suru/cmd/suruc@main
      - name: 試験
        run: ~/go/bin/kumu 試験
      - name: 点検
        run: ~/go/bin/kumu 点検
      - name: 例のサイトに curl で聞く
        run: |
          mkdir -p 出力
          ~/go/bin/suruc 例/サイト.suru -o 出力/サイト
          ./出力/サイト > 出力/サイト.log 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.2; done
          check() { got=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' --path-as-is "http://127.0.0.1:8080$1"); echo "$1 → $got"; [ "$got" = "$2" ]; }
          check / "200 text/html; charset=utf-8"
          check /%E6%A7%98%E5%BC%8F.css "200 text/css; charset=utf-8"
          check /%E7%94%BB%E5%83%8F/%E5%8D%B0.png "200 image/png"
          check /%E7%94%BB%E5%83%8F "301 text/plain; charset=utf-8"
          check /api/x "200 text/plain; charset=utf-8"
          check /no.html "404 text/plain; charset=utf-8"
          check /../%E7%B5%84.suru "403 text/plain; charset=utf-8"
          check /%2e%2e/%E7%B5%84.suru "403 text/plain; charset=utf-8"
          curl -s http://127.0.0.1:8080/%E7%94%BB%E5%83%8F/%E5%8D%B0.png | cmp - 例/公開/画像/印.png
          kill %1
      - name: 例のブラウザチャットに curl で聞く(LLM はいないので、失敗の知らせが流れてくる)
        run: |
          ~/go/bin/suruc 例/ブラウザチャット.suru -o 出力/ブラウザチャット
          ./出力/ブラウザチャット 試験 http://127.0.0.1:9 8090 > 出力/ブラウザチャット.log 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8090/ && break; sleep 0.2; done
          curl -s -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:8090/ | grep -x '200 text/html; charset=utf-8'
          curl -s http://127.0.0.1:8090/api/info | grep -F '"model":"試験"'
          curl -s -D 出力/見出し -X POST -d '{"messages":[{"role":"user","content":"a"}]}' http://127.0.0.1:8090/api/chat | tee 出力/答え
          grep -i '^transfer-encoding: chunked' 出力/見出し
          grep -F '{"error":"http://127.0.0.1:9/api/chat に聞けませんでした' 出力/答え
          kill %1
      - name: 例のブラウザチャットに WebSocket で聞く(LLM はいないので、失敗の知らせと終わりの印が届く)
        run: |
          ./出力/ブラウザチャット 試験 http://127.0.0.1:9 8091 > 出力/ブラウザチャット2.log 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8091/ && break; sleep 0.2; done
          node -e '
            const ws = new WebSocket("ws://127.0.0.1:8091/ws"); const got = [];
            const t = setTimeout(() => { console.error("時間切れ", got); process.exit(1); }, 10000);
            ws.onopen = () => ws.send(JSON.stringify({ messages: [{ role: "user", content: "a" }] }));
            ws.onmessage = (e) => { console.log(e.data.trim()); got.push(JSON.parse(e.data)); if (got.at(-1).done) ws.close(); };
            ws.onclose = () => { clearTimeout(t); process.exit(got.length === 2 && got[0].error.includes("に聞けませんでした") && got[1].done ? 0 : 1); };'
          kill %1
      - name: 例のこだまに WebSocket で話す
        run: |
          ~/go/bin/suruc 例/こだま.suru -o 出力/こだま
          ./出力/こだま > 出力/こだま.log 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.2; done
          node -e '
            const ws = new WebSocket("ws://127.0.0.1:8080/"); ws.binaryType = "arraybuffer"; const got = [];
            const t = setTimeout(() => { console.error("時間切れ", got); process.exit(1); }, 10000);
            ws.onopen = () => { ws.send("こんにちは"); ws.send(new Uint8Array([1, 2, 255])); ws.send("x".repeat(70000)); };
            ws.onmessage = (e) => { got.push(typeof e.data === "string" ? e.data.slice(0, 20) + " " + e.data.length : [...new Uint8Array(e.data)].join(",")); if (got.length === 3) ws.close(1000); };
            ws.onclose = (e) => { clearTimeout(t); console.log(got, e.code); process.exit(got[0] === "返事: こんにちは 9" && got[1] === "1,2,255" && got[2].endsWith(" 70004") && e.code === 1000 ? 0 : 1); };'
          kill %1
      - name: HTTPS を確かめる
        run: |
          mkdir -p 出力/証明書 && cd 出力/証明書
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 2 -subj "/CN=test CA"
          openssl req -newkey rsa:2048 -nodes -keyout srv.key -out srv.csr -subj "/CN=localhost"
          printf "subjectAltName=DNS:localhost\n" > ext
          openssl x509 -req -in srv.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out srv.pem -days 2 -extfile ext
          python3 ../../.github/試験/TLS相手.py 18443 > ../TLS相手.log 2>&1 &
          cd ../..
          for i in $(seq 50); do nc -z 127.0.0.1 18443 && break; sleep 0.2; done
          ~/go/bin/suruc .github/試験/https確認.suru -o 出力/https確認
          SSL_CERT_FILE=出力/証明書/ca.pem ./出力/https確認 18443
          # 証明書を渡さなければ、手元の相手は確かめられずに失敗する
          ! ./出力/https確認 18443
          kill %1
      - name: 本物の HTTPS のサイトに聞く
        run: |
          ~/go/bin/suruc .github/試験/本物確認.suru -o 出力/本物確認
          ./出力/本物確認

  # Windows では MSYS2 の UCRT64(clang・lld・Go・pkg-config・OpenSSL)で kumu 試験 と kumu 点検 を動かす。
  # lld は日本語の道(出力/)に書くのに要る
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
      - name: kumu を入れる
        env:
          GOPROXY: direct
        run: go install github.com/suru-lang/suru/cmd/kumu@ff847e8aa6e374b95635497b032d5788b50c44cb
      - name: 試験
        run: |
          export PATH="$(cygpath -u "$(go env GOPATH)")/bin:$PATH"
          kumu 試験
      - name: 点検
        run: |
          export PATH="$(cygpath -u "$(go env GOPATH)")/bin:$PATH"
          kumu 点検
